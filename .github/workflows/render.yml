name: Render Motion Video

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install headless Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64 libpango-1.0-0 \
            libcairo2 libatspi2.0-0 || sudo apt-get install -y libasound2

      - name: Install dependencies
        run: npm install

      - name: Ensure headless browser is downloaded
        run: npx remotion browser ensure

      - name: Render video
        run: npm run render

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/hook.mp4
          retention-days: 14
