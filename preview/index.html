<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beyond Minds — Video Preview</title>
    <style>
      body {
        margin: 0;
        background: #0a0a0b;
        font-family: -apple-system, sans-serif;
      }
      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
      }
      .wrap {
        width: 100%;
        max-width: 900px;
      }
      h1 {
        color: #fff;
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 12px;
        text-align: center;
      }
      .player-shell {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 40px rgba(0,0,0,0.5);
      }
    </style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
